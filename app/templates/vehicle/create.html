{% extends "base.html" %}

{% block content %}

<main class="form-page">

    <h1>Cadastrar veículo</h1>

    <p>
        Preencha os dados abaixo para cadastrar um novo veículo no sistema.
    </p>

    <form method="POST">

        <div class="field">
            <label for="license_plate">Placa</label>

            <input
                type="text"
                id="license_plate"
                name="license_plate"
                maxlength="20"
                required
            >
        </div>

        <div class="field">
            <label for="model">Modelo</label>

            <input
                type="text"
                id="model"
                name="model"
                maxlength="100"
                required
            >
        </div>

        <div class="field">
            <label for="cargo_capacity_kg">
                Capacidade de carga (KG)
            </label>

            <input
                type="number"
                id="cargo_capacity_kg"
                name="cargo_capacity_kg"
                min="1"
                required
            >
        </div>

        <div class="field">
            <label for="cargo_capacity_m3">
                Capacidade de carga (M³)
            </label>

            <input
                type="number"
                id="cargo_capacity_m3"
                name="cargo_capacity_m3"
                min="0.01"
                step="0.01"
                required
            >
        </div>

        <div class="field">
            <label for="axle_count">
                Quantidade de eixos
            </label>

            <input
                type="number"
                id="axle_count"
                name="axle_count"
                min="1"
                required
            >
        </div>

        <div class="field">
            <label for="odometer">
                Odômetro
            </label>

            <input
                type="number"
                id="odometer"
                name="odometer"
                min="0"
                required
            >
        </div>

        <div class="field">

            <label for="status">
                Status
            </label>

            <select id="status" name="status">

                <option value="AVAILABLE">
                    Disponível
                </option>

                <option value="MAINTENANCE">
                    Em manutenção
                </option>

                <option value="UNAVAILABLE">
                    Indisponível
                </option>

            </select>

        </div>

        <div class="field">

            <label for="fuel_type">
                Tipo de combustível
            </label>

            <select id="fuel_type" name="fuel_type">

                <option value="DIESEL">
                    Diesel
                </option>

                <option value="GASOLINE">
                    Gasolina
                </option>

                <option value="ETHANOL">
                    Etanol
                </option>

                <option value="FLEX">
                    Flex
                </option>

                <option value="ELECTRIC">
                    Elétrico
                </option>

            </select>

        </div>

        <button type="submit">
            Cadastrar veículo
        </button>

        <a
            href="{{ url_for('vehicle.index') }}"
            class="cancel"
        >
            Cancelar
        </a>

    </form>

</main>

{% endblock %}
