<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Base</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav>
        <div><h1>LOG Logistica</h1></div>

        <div>
            <div class="nav-item">
                <a href="#">Clientes</a>

                <div class="dropdown">
                    <a href="{{ url_for('client.client') }}">Clientes</a>
                    <a href="{{ url_for('client.create_client') }}">Criar cliente</a>
                </div>
            </div>
        </div>
        <div>
            <div class="nav-item">
                <a href="#">Veiculos</a>

                <div class="dropdown">
                    <a href="{{ url_for('vehicle.index') }}">Veiculos</a>
                    <a href="{{ url_for('vehicle.create_vehicle') }}">Criar veiculo</a>
                </div>
            </div>
        </div>
        <div>
            <div class="nav-item">
                <a href="#">Motoristas</a>

                <div class="dropdown">
                    <a href="{{ url_for('driver.index') }}">Motoristas</a>
                    <a href="{{ url_for('driver.driver_create') }}">Criar Motoristas</a>
                </div>
            </div>
        </div>


    </nav>

        {% for category, message in get_flashed_messages(with_categories=true) %}
           <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}

    {% block content %}
    {% endblock %}

</body>
</html>
