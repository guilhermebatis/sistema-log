{% extends "base.html" %}

{% block content %}

    <main class="form-page">

        <h1>Editar cliente</h1>

        <p>
            Altere os dados abaixo para atualizar o cliente no sistema.
        </p>

        <form
            method="POST"
            action="{{ url_for('client.client_update', id=data.id) }}"
        >

            <div class="field">
                <label for="name">Nome completo</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ data.name }}"
                    maxlength="100"
                    required
                >
            </div>

            <div class="field">
                <label for="CPF_CNPJ">CPF/CNPJ</label>

                <input
                    type="text"
                    id="CPF_CNPJ"
                    name="CPF_CNPJ"
                    value="{{ data.CPF_CNPJ }}"
                    maxlength="15"
                    required
                >
            </div>

            <div class="field">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ data.email or '' }}"
                    maxlength="100"
                >
            </div>

            <div class="field">
                <label for="phone">Telefone</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    value="{{ data.phone }}"
                    maxlength="100"
                    required
                >
            </div>

            <button type="submit">
                Salvar alterações
            </button>

            <a
                href="{{ url_for('client.client') }}"
                class="cancel"
            >
                Cancelar
            </a>

        </form>

    </main>

{% endblock %}
