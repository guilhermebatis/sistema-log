
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar cliente</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #1f2937;
        }

        main {
            max-width: 650px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        p {
            color: #64748b;
            margin-bottom: 24px;
        }

        form {
            background: white;
            padding: 28px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            padding: 12px;
            margin-bottom: 16px;
            border-radius: 6px;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
        }

        .message.danger {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>
    <main>
        <h1>Cadastrar cliente</h1>

        <p>
            Preencha os dados abaixo para cadastrar um novo cliente no sistema.
        </p>

        {% for category, message in get_flashed_messages(with_categories=true) %}
           <div class="message {{ category }}">{{ message }}</div>
        {% endfor %}

        <form method="POST">
            <div class="field">
                <label for="name">Nome completo</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Digite o nome completo"
                    maxlength="100"
                    required
                >
            </div>

            <div class="field">
                <label for="CPF_CNPJ">CPF/CNPJ</label>
                <input
                    type="text"
                    id="CPF_CNPJ"
                    name="CPF_CNPJ"
                    placeholder="Digite o CPF ou CNPJ"
                    maxlength="15"
                    required
                >
            </div>

            <div class="field">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite o e-mail"
                    maxlength="100"
                >
            </div>

            <div class="field">
                <label for="phone">Telefone</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Digite o telefone"
                    maxlength="100"
                    required
                >
            </div>

            <button type="submit">Cadastrar cliente</button>
        </form>
    </main>
</body>
</html>
