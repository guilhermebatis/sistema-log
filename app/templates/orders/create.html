{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <h1>Nova Ordem de Serviço</h1>


    <form method="POST">

        <div class="field">
            <label for="client_id">Cliente</label>

            <select name="client_id" id="client_id">
                <option value="">Nenhum cliente</option>

                {% for client in clients %}
                    <option value="{{ client.id }}">
                        {{ client.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label for="weight_total">Peso total (kg)</label>
            <input
                type="number"
                id="weight_total"
                name="weight_total"
                step="0.01"
                min="0"
            >
        </div>

        <div class="field">
            <label for="cubage_total">Cubagem total (m³)</label>
            <input
                type="number"
                id="cubage_total"
                name="cubage_total"
                step="0.01"
                min="0"
            >
        </div>

        <div class="field">
            <label for="origin">Origem</label>
            <input
                type="text"
                id="origin"
                name="origin"
                maxlength="20"
                required
            >
        </div>

        <div class="field">
            <label for="destination">Destino</label>
            <input
                type="text"
                id="destination"
                name="destination"
                maxlength="20"
                required
            >
        </div>

        <div class="field">
            <label for="distance">Distância (km)</label>
            <input
                type="number"
                id="distance"
                name="distance"
                step="0.01"
                min="0"
                required
            >
        </div>

        <div class="field">
            <label for="price">Preço</label>
            <input
                type="number"
                id="price"
                name="price"
                step="0.01"
                min="0"
            >
        </div>

        <div class="field">
            <label for="status">Status</label>

            <select id="status" name="status" required>

                <option value="">Selecione</option>

                <option value="PENDING">
                    Pendente
                </option>

                <option value="QUOTED">
                    Cotado
                </option>

                <option value="IN_PROGRESS">
                    Em andamento
                </option>

                <option value="COMPLETED">
                    Concluído
                </option>

                <option value="CANCELLED">
                    Cancelado
                </option>

            </select>
        </div>

        <div class="form-actions">

            <button type="submit" class="btn">
                Salvar
            </button>

            <a href="{{ url_for('orders.index') }}" class="btn cancel">
                Cancelar
            </a>

        </div>

    </form>

</div>

{% endblock %}
