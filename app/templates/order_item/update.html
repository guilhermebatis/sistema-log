{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <h1>Editar Item da Ordem</h1>

    <form method="POST">

         <label for="order_service_id">
        Ordem de Serviço
    </label>

        <div class="field">
            <select
                name="order_service_id"
                id="order_service_id"
                required
            >
                {% for order in order_services %}
                    <option
                        value="{{ order.id }}"
                        {% if order.id == data.order_service_id %}selected{% endif %}
                    >
                        #{{ order.id }} - {{ order.origin }} → {{ order.destination }}
                    </option>
                {% endfor %}
            </select>

            <small>
                Ordem atual: #{{ data_order.id }}
            </small>
        </div>


        <div class="field">
            <label for="quantity">
                Quantidade
            </label>

            <input
                type="number"
                name="quantity"
                id="quantity"
                value="{{ data.quantity }}"
                min="0"
                required
            >
        </div>


        <div class="field">
            <label for="description">
                Descrição
            </label>

            <input
                type="text"
                name="description"
                id="description"
                value="{{ data.description or '' }}"
            >
        </div>


        <div class="field">
            <label for="weight">
                Peso
            </label>

            <input
                type="number"
                name="weight"
                id="weight"
                value="{{ data.weight }}"
                min="0"
                step="0.01"
                required
            >
        </div>


        <div class="field">
            <label for="cubage">
                Cubagem
            </label>

            <input
                type="number"
                name="cubage"
                id="cubage"
                value="{{ data.cubage }}"
                min="0"
                step="0.01"
                required
            >
        </div>


        <div class="field">
            <label for="price_item">
                Preço do Item
            </label>

            <input
                type="number"
                name="price_item"
                id="price_item"
                value="{{ data.price_item }}"
                min="0"
                step="0.01"
                required
            >
        </div>


        <button type="submit">
            Salvar alterações
        </button>


        <a
            href="{{ url_for('driver.index') }}"
            class="cancel"
        >
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
