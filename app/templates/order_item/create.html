{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <h1>Novo Item da Ordem</h1>

    <form method="POST">

        <div class="field">
            <label for="order_service_id">
                Ordem de Serviço
            </label>

            <select
                name="order_service_id"
                id="order_service_id"
                required
            >
                <option value="">Selecione uma ordem de serviço</option>

                {% for order in order_services %}
                    <option value="{{ order.id }}">
                        #{{ order.id }} - {{ order.origin }} → {{ order.destination }}
                    </option>
                {% endfor %}

            </select>
        </div>


        <div class="field">
            <label for="quantity">
                Quantidade
            </label>

            <input
                type="number"
                name="quantity"
                id="quantity"
                min="0"
                required
            >
        </div>


        <div class="field">
            <label for="description">
                Descrição
            </label>

            <input
                type="text"
                name="description"
                id="description"
                maxlength="100"
            >
        </div>


        <div class="field">
            <label for="weight">
                Peso
            </label>

            <input
                type="number"
                name="weight"
                id="weight"
                min="0"
                step="0.01"
                required
            >
        </div>


        <div class="field">
            <label for="cubage">
                Cubagem
            </label>

            <input
                type="number"
                name="cubage"
                id="cubage"
                min="0"
                step="0.01"
                required
            >
        </div>


        <div class="field">
            <label for="price_item">
                Preço do Item
            </label>

            <input
                type="number"
                name="price_item"
                id="price_item"
                min="0"
                step="0.01"
                required
            >
        </div>


        <button type="submit">
            Salvar alterações
        </button>


        <a
            href="{{ url_for('driver.index') }}"
            class="cancel"
        >
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
